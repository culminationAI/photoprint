[pytest]
pythonpath = app tests
testpaths = tests
# Любое предупреждение — ошибка теста, кроме двух, которые у заказчика
# безвредны, чтобы тесты видели то же, что заказчик (§ 7.2):
# - DecompressionBombWarning (F8): его выключает и сам модуль `folder` при
#   импорте, но pytest ставит фильтры на каждый тест заново, и `error`
#   перекрыл бы фильтр модуля;
# - UserWarning из модулей Pillow (`PIL.*`), например «Truncated File Read»
#   о теге EXIF за концом блока: у заказчика это строка в Терминале, а снимок
#   пригоден и печатается (F3 п. 4, F6). Ошибкой он стал бы исключением
#   `Image.open`, и тесты видели бы «файл не читается».
filterwarnings =
    error
    ignore::PIL.Image.DecompressionBombWarning
    ignore::UserWarning:PIL\..*
